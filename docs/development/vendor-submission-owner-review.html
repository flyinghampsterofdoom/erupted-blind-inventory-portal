        throw Object.assign(Error("No committed receipt"), { status: 404 });
      }
      if (url.startsWith("/api/vendor-authorizations/")) return { artifacts: [], commands: [], kind: "PO", snapshot: { supplier: { automatic_po_email: false } } };
      if (url === "preview") return { vendors: body };
      throw Error("Unexpected isolated endpoint " + url);
    };
    const workflow = new SubmissionWorkflow({ api, canAuthorize: () => true, current: () => ({ session: { id: "synthetic-session", version: 1, owner_id: 1 }, rows: [] }), ready: async () => {
    }, refresh: async () => {
      demo.refreshes++;
    }, notify: () => {
    } });
    const selection = new VendorSelection({ session: () => "synthetic-session", vendors: () => options, canSubmit: () => true, ready: async () => {
    }, preview: (ids) => api("preview", ids), submit: (ids, back) => workflow.start(ids, back) });
    document.querySelector("#open").onclick = () => selection.open();
    window.workflow = workflow;
    window.selection = selection;
  };
  window.initDemo();
})();
