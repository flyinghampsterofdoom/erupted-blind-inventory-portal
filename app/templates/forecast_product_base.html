<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forecasting · Erupted Admin</title>
<style>
:root{--ink:#19312e;--muted:#5d706a;--line:#dce5df;--green:#175c49;--cream:#f5f7f2;--amber:#94601d}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:15px/1.5 system-ui,sans-serif;color:var(--ink)}header{background:#163c32;color:white;padding:20px 4%;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px;letter-spacing:.02em}header a{color:#e0eee3;margin-left:24px;text-decoration:none}main{max-width:1510px;margin:auto;padding:30px 4% 60px}a{color:var(--green)}h1{font-size:34px;letter-spacing:-.04em;line-height:1.2;margin:6px 0 12px}h2{font-size:21px;margin:0 0 14px}h3{font-size:15px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:750;color:var(--green)}.muted,small{color:var(--muted)}.notice{background:#fff5df;border:1px solid #e8d5a9;border-radius:9px;padding:12px 18px;margin:20px 0;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.button,button{display:inline-block;background:var(--green);border:0;border-radius:7px;color:white;padding:10px 17px;text-decoration:none;font:inherit;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}.card b{display:block;font-size:29px;margin:5px 0}.card a{font-size:12px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#eaf0e9;padding:18px;border-radius:10px;margin:22px 0}label{font-size:12px;font-weight:650}input,select{display:block;width:100%;background:white;border:1px solid #c6d3c9;border-radius:6px;padding:10px;margin-top:5px;font:inherit;color:var(--ink)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;padding:13px 16px;background:#edf2eb;color:var(--muted);font-size:11px;letter-spacing:.03em}td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}td small{display:block}td a{font-weight:650;text-decoration:none}.num{white-space:nowrap;text-align:right}.tag{display:inline-block;border-radius:5px;padding:3px 7px;background:#f8ead2;color:#80551c;font-size:11px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin:22px 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.facts strong{font-size:26px;display:block}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.foot{margin-top:22px;font-size:12px;color:var(--muted)}svg{width:100%;height:180px}.compact td{padding:10px 14px}.empty{padding:30px}.subtle{background:#e9f1ed;border:1px solid #cadfd2;padding:15px;border-radius:8px}.pager{display:flex;gap:24px;margin:20px 0}details{margin-top:18px}summary{cursor:pointer;font-weight:650}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.filters,.facts{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}header a{margin-left:10px}}
</style></head><body><header><strong>ERUPTED <span style="font-weight:350">/ Admin</span></strong><nav><a href="/management/forecasting">Forecasting</a><a href="/management/forecast-validation">Evidence audit</a><span style="margin-left:24px;font-size:12px">OWNER · ADVISORY</span></nav></header><main>{% block content %}{% endblock %}<p class="foot">Frozen evidence · Origin {{meta.origin}} · {{meta.policy_version}} · Read-only advisory. No orders, transfers or inventory changes. No Square collection.</p></main></body></html>
