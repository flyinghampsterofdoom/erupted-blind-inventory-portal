name: Erupted CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expanded: ${{ steps.select.outputs.expanded }}
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.13'
      - id: select
        name: Conservative dependency selection
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/policy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/selection.json
          retention-days: 7
          if-no-files-found: error

  validate:
    name: Validate (${{ matrix.suite }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    services:
      postgres:
        # Exact server and backup clients; digest is the official multiarch index.
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --volume /tmp:/tmp
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci_only@127.0.0.1:5432/postgres
      TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:ci_only@127.0.0.1:5432/postgres
      P1_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_only@127.0.0.1:5432/erupted_purchasing_p1_ci
      SCHEDULE_AUTOMATION_EXECUTION_ENABLED: 'false'
      FORECAST_VALIDATION_WORKER_ENABLED: 'false'
      FORECAST_VALIDATION_SCHEDULE_ENABLED: 'false'
      SQUARE_ACCESS_TOKEN: ''
      SNAPSHOT_PROVIDER: mock
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:tests
      TMPDIR: /tmp
      CI_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - id: setup
        name: Install locked dependencies and pinned database tools
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          python -m pip check
          bash scripts/ci/database_tools.sh
      - id: preflight
        name: Assert clean checkout and disposable environment
        run: python scripts/ci/preflight.py
      - id: build
        name: Verify application and web/cron build
        run: |
          mkdir -p ci-results
          sh scripts/release/build.sh > ci-results/build.log 2>&1
          python -m compileall -q app scripts migrations
          cp release-identity.json ci-results/release-identity.json
      - id: javascript
        name: JavaScript regression tests
        if: matrix.suite == 'fast'
        run: node --test tests/js/*.cjs tests/blind_count_controller_test.cjs > ci-results/javascript.log 2>&1
      - id: tests
        name: Python regressions with test-phase network isolation
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.preflight.outcome == 'success' }}
        run: bash scripts/ci/offline.sh python -m scripts.ci.run "$CI_SUITE"
      - name: Publish stage results and skip explanations
        if: always()
        env:
          SETUP_RESULT: ${{ steps.setup.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          JS_RESULT: ${{ steps.javascript.outcome }}
        run: |
          if [ -f scripts/ci/summary.py ]; then
            python scripts/ci/summary.py
          else
            mkdir -p ci-results
            echo "Checkout/setup failed before test collection." | tee ci-results/setup-failure.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload synthetic diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  required:
    name: CI required
    if: always()
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all expected validation jobs to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          EXPANDED: ${{ needs.plan.outputs.expanded }}
          SUITES: ${{ needs.plan.outputs.suites }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          full = ['fast', 'schedule-foundation', 'schedule-a', 'schedule-b', 'purchasing', 'inventory-access', 'platform-forecast', 'other']
          assert os.environ['PLAN_RESULT'] == 'success', 'Selection failed/cancelled/skipped'
          assert os.environ['EXPANDED'] in ('true', 'false'), 'Invalid selection result'
          if os.environ['CI_EVENT'] != 'pull_request':
              assert os.environ['EXPANDED'] == 'true', 'Push/manual runs must expand'
          assert json.loads(os.environ['SUITES']) == (full if os.environ['EXPANDED'] == 'true' else ['fast'])
          assert os.environ['VALIDATION_RESULT'] == 'success', 'A required validation failed/cancelled/skipped'
          print('PASS: every planned validation succeeded; unexpected skips fail inside pytest policy.')
          PY
